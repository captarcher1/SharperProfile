<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    2026-09-28 — Git dropped from this diagram (was card 2 of 4). Checked
    lib/vercelDeploy.ts before removing it: publishing calls Vercel's
    non-git deployment API directly (POST /v13/deployments with the files
    sent inline), so nothing this tool actually does needs Git installed —
    it was only listed because "download this project" had an unresolved
    choice between a ZIP download and `git clone <url>`, now resolved to
    ZIP-only (see the "Getting started" list below). Down to 3 cards,
    re-spaced evenly across the same width.
  -->
  <rect x="0" y="0" width="860" height="220" fill="#ffffff"/>

  <!-- Card 1: Node.js -->
  <g>
    <rect x="10" y="10" width="266" height="170" rx="4" fill="#e8ecee" stroke="#c4d0d7" stroke-width="1.5"/>
    <polygon points="143,40 171,56 171,88 143,104 115,88 115,56" fill="none" stroke="#0f6e5c" stroke-width="3" stroke-linejoin="round"/>
    <text x="143" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#0f6e5c">JS</text>
    <text x="143" y="134" text-anchor="middle" font-size="14" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">Node.js</text>
    <text x="143" y="153" text-anchor="middle" font-size="11" fill="#42535f">free, one-time</text>
    <text x="143" y="168" text-anchor="middle" font-size="11" fill="#42535f">install</text>
  </g>

  <!-- Card 2: AI provider key -->
  <g>
    <rect x="296" y="10" width="266" height="170" rx="4" fill="#e8ecee" stroke="#c4d0d7" stroke-width="1.5"/>
    <circle cx="407" cy="70" r="16" fill="none" stroke="#9a6f1e" stroke-width="3.5"/>
    <line x1="419" y1="82" x2="451" y2="114" stroke="#9a6f1e" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="435" y1="98" x2="445" y2="108" stroke="#9a6f1e" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="445" y1="108" x2="455" y2="98" stroke="#9a6f1e" stroke-width="3.5" stroke-linecap="round"/>
    <text x="429" y="134" text-anchor="middle" font-size="14" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">An AI provider key</text>
    <text x="429" y="153" text-anchor="middle" font-size="11" fill="#42535f">Anthropic, Google, or</text>
    <text x="429" y="168" text-anchor="middle" font-size="11" fill="#42535f">OpenRouter (or use local Ollama — no key)</text>
  </g>

  <!-- Card 3: Vercel account -->
  <g>
    <rect x="582" y="10" width="268" height="170" rx="4" fill="#e8ecee" stroke="#c4d0d7" stroke-width="1.5"/>
    <g transform="translate(-58,-16)">
      <path d="M 700 90 a 22 22 0 1 1 44 6 a 16 16 0 0 1 -4 32 l -36 0 a 18 18 0 0 1 -4 -38 z" fill="none" stroke="#2c5578" stroke-width="3"/>
      <line x1="722" y1="72" x2="722" y2="100" stroke="#2c5578" stroke-width="3" stroke-linecap="round"/>
      <path d="M 712 82 L 722 70 L 732 82" stroke="#2c5578" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="716" y="134" text-anchor="middle" font-size="14" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">A free Vercel account</text>
    <text x="716" y="153" text-anchor="middle" font-size="11" fill="#42535f">to publish your finished</text>
    <text x="716" y="168" text-anchor="middle" font-size="11" fill="#42535f">site live</text>
  </g>
</svg>
