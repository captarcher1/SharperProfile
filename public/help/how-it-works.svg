<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="260" fill="#ffffff"/>

  <!-- Box 1: Resume -->
  <g>
    <rect x="24" y="30" width="220" height="140" rx="4" fill="#e8ecee" stroke="#c4d0d7" stroke-width="1.5"/>
    <rect x="94" y="56" width="80" height="100" rx="2" fill="#ffffff" stroke="#7a8994" stroke-width="2"/>
    <line x1="106" y1="76" x2="162" y2="76" stroke="#7a8994" stroke-width="3" stroke-linecap="round"/>
    <line x1="106" y1="90" x2="162" y2="90" stroke="#c4d0d7" stroke-width="3" stroke-linecap="round"/>
    <line x1="106" y1="104" x2="150" y2="104" stroke="#c4d0d7" stroke-width="3" stroke-linecap="round"/>
    <line x1="106" y1="118" x2="162" y2="118" stroke="#c4d0d7" stroke-width="3" stroke-linecap="round"/>
    <line x1="106" y1="132" x2="140" y2="132" stroke="#c4d0d7" stroke-width="3" stroke-linecap="round"/>
    <text x="134" y="192" text-anchor="middle" font-size="16" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">Your resume</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 254 100 L 306 100" stroke="#2c5578" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#42535f">reads</text>

  <!-- Box 2: Tool -->
  <g>
    <rect x="316" y="30" width="228" height="140" rx="4" fill="#ffffff" stroke="#2c5578" stroke-width="1.5"/>
    <rect x="382" y="60" width="96" height="66" rx="2" fill="#ffffff" stroke="#2c5578" stroke-width="2"/>
    <rect x="382" y="126" width="96" height="8" rx="1" fill="#2c5578"/>
    <circle cx="430" cy="93" r="14" fill="none" stroke="#2c5578" stroke-width="2.5"/>
    <path d="M 430 86 L 430 93 L 435 97" stroke="#2c5578" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="430" y="192" text-anchor="middle" font-size="16" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">This tool</text>
    <text x="430" y="210" text-anchor="middle" font-size="12" fill="#42535f">running on your computer</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 554 100 L 606 100" stroke="#2c5578" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="580" y="86" text-anchor="middle" font-size="12" fill="#42535f">builds</text>

  <!-- Box 3: Website -->
  <g>
    <rect x="616" y="30" width="220" height="140" rx="4" fill="#ffffff" stroke="#0f6e5c" stroke-width="1.5"/>
    <rect x="676" y="58" width="100" height="72" rx="2" fill="#ffffff" stroke="#0f6e5c" stroke-width="2"/>
    <rect x="676" y="58" width="100" height="16" rx="2" fill="#0f6e5c"/>
    <circle cx="684" cy="66" r="2.5" fill="#ffffff"/>
    <circle cx="692" cy="66" r="2.5" fill="#ffffff"/>
    <circle cx="700" cy="66" r="2.5" fill="#ffffff"/>
    <line x1="684" y1="90" x2="768" y2="90" stroke="#d6e7e2" stroke-width="3" stroke-linecap="round"/>
    <line x1="684" y1="102" x2="748" y2="102" stroke="#d6e7e2" stroke-width="3" stroke-linecap="round"/>
    <line x1="684" y1="114" x2="756" y2="114" stroke="#d6e7e2" stroke-width="3" stroke-linecap="round"/>
    <text x="726" y="192" text-anchor="middle" font-size="16" font-weight="600" font-family="Charter, Georgia, serif" fill="#14202b">Your portfolio site</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c5578"/>
    </marker>
  </defs>

  <text x="430" y="248" text-anchor="middle" font-size="13" fill="#42535f">Everything above happens on your own computer — nothing runs on a server the developer operates.</text>
</svg>
