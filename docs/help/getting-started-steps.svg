<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    2026-09-28 — condensed from 6 steps to 5, mirroring the same fix applied
    to public/help/getting-started-steps.svg: double-click launchers
    (`Start SharperProfile.bat` / `.command`, `start.sh`) now handle
    `npm install` + `npm run dev` + opening the browser as one step, so the
    old separate "run npm install" / "run npm run dev" / "open
    http://localhost:3001" steps collapse into a single "double-click the
    launcher" step (which also covers uploading the résumé, since that
    happens right in the browser tab the launcher opens). Left in this
    file's original un-recolored blue palette on purpose, same as the last
    content fix to this file — re-theming README's own diagrams to the
    app's ledger palette is a separate, not-yet-requested pass.
  -->
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <!-- connecting line -->
  <line x1="40" y1="40" x2="40" y2="360" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Step 1 -->
  <circle cx="40" cy="40" r="20" fill="#2563eb"/>
  <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="34" font-size="15" font-weight="600" fill="#1e293b">Install Node.js</text>
  <text x="76" y="54" font-size="12.5" fill="#64748b">One free, standard developer tool — one-time setup</text>

  <!-- Step 2 -->
  <circle cx="40" cy="120" r="20" fill="#2563eb"/>
  <text x="40" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="76" y="114" font-size="15" font-weight="600" fill="#1e293b">Download this project as a ZIP</text>
  <text x="76" y="134" font-size="12.5" fill="#64748b">Unzip it — that's it, no terminal needed yet</text>

  <!-- Step 3 -->
  <circle cx="40" cy="200" r="20" fill="#2563eb"/>
  <text x="40" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="76" y="194" font-size="15" font-weight="600" fill="#1e293b">Double-click the launcher for your system</text>
  <text x="76" y="214" font-size="12.5" fill="#64748b">Installs everything, starts the tool, opens your browser — upload your résumé there</text>

  <!-- Step 4 -->
  <circle cx="40" cy="280" r="20" fill="#2563eb"/>
  <text x="40" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="76" y="274" font-size="15" font-weight="600" fill="#1e293b">Review your sections and add your AI key</text>
  <text x="76" y="294" font-size="12.5" fill="#64748b">Or choose Ollama to skip the key entirely</text>

  <!-- Step 5 (generate, review, and publish — fully built) -->
  <circle cx="40" cy="360" r="20" fill="#2563eb"/>
  <text x="40" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="76" y="354" font-size="15" font-weight="600" fill="#1e293b">Generate, review, and publish</text>
  <text x="76" y="374" font-size="12.5" fill="#64748b">One click publishes to your own Vercel account. It's live.</text>
</svg>
