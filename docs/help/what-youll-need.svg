<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- 2026-09-28 — Git card dropped (was card 2 of 4): publishing goes through
       Vercel's non-git deployment API directly, never GitHub, and this
       project is downloaded as a plain ZIP, so Git was never actually
       required. Down to 3 cards, re-spaced. (This docs/ copy still uses its
       older, un-recolored style — the app/globals.css ledger-theme pass
       only touched public/help/; re-theming README's own diagrams is
       tracked separately in PROJECT-STATE.md.) -->
  <rect x="0" y="0" width="860" height="220" fill="#ffffff"/>

  <!-- Card 1: Node.js -->
  <g>
    <rect x="10" y="10" width="266" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <polygon points="143,40 171,56 171,88 143,104 115,88 115,56" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
    <text x="143" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">JS</text>
    <text x="143" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Node.js</text>
    <text x="143" y="153" text-anchor="middle" font-size="11" fill="#64748b">free, one-time</text>
    <text x="143" y="168" text-anchor="middle" font-size="11" fill="#64748b">install</text>
  </g>

  <!-- Card 2: AI provider key -->
  <g>
    <rect x="296" y="10" width="266" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="407" cy="70" r="16" fill="none" stroke="#d97706" stroke-width="3.5"/>
    <line x1="419" y1="82" x2="451" y2="114" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="435" y1="98" x2="445" y2="108" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="445" y1="108" x2="455" y2="98" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <text x="429" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">An AI provider key</text>
    <text x="429" y="153" text-anchor="middle" font-size="11" fill="#64748b">Anthropic, Google, or</text>
    <text x="429" y="168" text-anchor="middle" font-size="11" fill="#64748b">OpenRouter (or use local Ollama — no key)</text>
  </g>

  <!-- Card 3: Vercel account -->
  <g>
    <rect x="582" y="10" width="268" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(-58,-16)">
      <path d="M 700 90 a 22 22 0 1 1 44 6 a 16 16 0 0 1 -4 32 l -36 0 a 18 18 0 0 1 -4 -38 z" fill="none" stroke="#2563eb" stroke-width="3"/>
      <line x1="722" y1="72" x2="722" y2="100" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <path d="M 712 82 L 722 70 L 732 82" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="716" y="134" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">A free Vercel account</text>
    <text x="716" y="153" text-anchor="middle" font-size="11" fill="#64748b">to publish your finished</text>
    <text x="716" y="168" text-anchor="middle" font-size="11" fill="#64748b">site live</text>
  </g>
</svg>
